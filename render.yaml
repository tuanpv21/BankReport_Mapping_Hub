databases:
  - name: bankreport-db
    databaseName: bankreport_hub
    user: hub_user
    plan: free
    region: singapore

services:
  - type: web
    name: bankreport-mapping-hub
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DATABASE_URL
        fromDatabase:
          name: bankreport-db
          property: connectionString